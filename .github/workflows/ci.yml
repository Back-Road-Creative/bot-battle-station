name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # The board is standard library only; pytest is the one dev dependency.
        run: python -m pip install pytest==8.3.5
      - name: Test
        # The suite builds made-up Claude Code directories in a temp dir: no
        # Claude Code install, no network.
        run: python -m pytest -q
