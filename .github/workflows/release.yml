name: Release

# Pushing a v* tag runs the tests, screenshots the board's --demo mode and
# attaches the screenshot and the board's files to that tag's GitHub release.
# The README's image is releases/latest/download/demo.png, so every release
# refreshes it, and it can only ever show invented sessions.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # gh release create / upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Test
        run: |
          python -m pip install pytest==8.3.5
          python -m pytest -q

      - name: Screenshot --demo
        # /?ack opens past the full-screen NEEDS YOU takeover, so the picture is
        # the grid. Chrome ships on the runner image.
        run: |
          python3 bin/session-board.py --demo --port 8765 > board.log 2>&1 &
          for _ in $(seq 1 50); do
            curl -sf http://localhost:8765/api > /dev/null && break
            sleep 0.2
          done
          curl -sf http://localhost:8765/api > /dev/null || { cat board.log; exit 1; }
          google-chrome --headless=new --no-sandbox --hide-scrollbars --window-size=1600,720 \
            --virtual-time-budget=6000 --screenshot="$PWD/demo.png" "http://localhost:8765/?ack"
          test "$(stat -c %s demo.png)" -gt 50000 || { echo "demo.png is too small to be the board"; exit 1; }

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        # Release files are flat (no bin/), so SHA256SUMS names them flat too.
        # The same script runs on every PR (tests/test_release_dist.py).
        run: |
          bash scripts/release-dist.sh dist demo.png
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/*
          fi
