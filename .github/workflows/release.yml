name: Release

# Pushing a v* tag runs the tests, screenshots the board's --demo mode and
# attaches the screenshot and the board's files to that tag's GitHub release.
# The README's image is releases/latest/download/demo.png, so every release
# refreshes it, and it can only ever show invented sessions.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # gh release create / upload

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Test
        run: |
          python -m pip install pytest==8.3.5
          python -m pytest -q

      - name: Screenshot --demo
        # /?ack opens past the full-screen NEEDS YOU takeover, so the picture is
        # the grid. Chrome ships on the runner image.
        run: |
          python3 bin/session-board.py --demo --port 8765 > board.log 2>&1 &
          for _ in $(seq 1 50); do
            curl -sf http://localhost:8765/api > /dev/null && break
            sleep 0.2
          done
          curl -sf http://localhost:8765/api > /dev/null || { cat board.log; exit 1; }
          google-chrome --headless=new --no-sandbox --hide-scrollbars --window-size=1600,720 \
            --virtual-time-budget=6000 --screenshot="$PWD/demo.png" "http://localhost:8765/?ack"
          test "$(stat -c %s demo.png)" -gt 50000 || { echo "demo.png is too small to be the board"; exit 1; }

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum bin/session-board.py bin/session-board.html bin/session-board-kiosk.ps1 demo.png > SHA256SUMS
          files="bin/session-board.py bin/session-board.html bin/session-board-kiosk.ps1 demo.png SHA256SUMS"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --clobber
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes $files
          fi
